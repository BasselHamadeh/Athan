name: Athan bauen

on:
  push:
    branches: [main]
    paths: ['web/**', 'windows/**', 'tools/**', 'installer/**', 'build.sh', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version bestimmen
        shell: bash
        run: |
          V=$(grep -oE "VERSION = '[0-9.]+'" web/js/app.js | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "VERSION=${V:-1.0.0}" >> "$GITHUB_ENV"

      - name: EXE + MSI (mkmsi)
        shell: bash
        run: ./build.sh

      - name: CAB-Diagnose (Referenz von makecab)
        continue-on-error: true
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          Copy-Item dist/Athan.exe "$t\AthanExe"
          Push-Location $t
          makecab.exe /D CompressionType=MSZIP AthanExe ref.cab | Out-Null
          Pop-Location
          function Show($path) {
            $b = [IO.File]::ReadAllBytes($path)
            Write-Host "== $path ($($b.Length) Bytes)"
            Write-Host ("HDR " + [BitConverter]::ToString($b, 0, 36))
            Write-Host ("FOLDER " + [BitConverter]::ToString($b, 36, 8))
            $cf = [BitConverter]::ToUInt32($b, 16); $cs = [BitConverter]::ToUInt32($b, 36)
            Write-Host ("FILE " + [BitConverter]::ToString($b, $cf, $cs - $cf))
            $o = $cs
            for ($i = 0; $i -lt 3; $i++) {
              $cb = [BitConverter]::ToUInt16($b, $o + 4)
              Write-Host ("DATA$i " + [BitConverter]::ToString($b, $o, 8) + " | " + [BitConverter]::ToString($b, $o + 8, 16))
              $o += 8 + $cb
            }
          }
          Show "$t\ref.cab"
          Push-Location tools
          go run ./mkmsi -exe ../dist/Athan.exe -cabmode fixed -cabout "$t\mine.cab" | Out-Null
          Pop-Location
          Show "$t\mine.cab"
          foreach ($c in 'ref','mine') {
            $d = "$t\x-$c"; New-Item -ItemType Directory -Force $d | Out-Null
            $o = & expand.exe "$t\$c.cab" "-F:*" $d 2>&1
            Write-Host "EXPAND $c :" (($o | Out-String) -replace '\s+', ' ')
            Get-ChildItem $d | ForEach-Object { Write-Host "  -> $($_.Name) $($_.Length)" }
          }

      - name: MSI zusätzlich mit WiX
        continue-on-error: true
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer/athan.wxs -arch x64 -d Version=$VERSION -o "dist/Athan-Setup-$VERSION-wix.msi"

      - name: MSI testweise installieren und wieder entfernen
        shell: pwsh
        run: |
          $msi = Resolve-Path "dist/Athan-Setup-$env:VERSION.msi"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content install.log -Encoding Unicode | Select-String -Pattern 'Return value 3|Note: 1: (1[0-9]{3}|2[0-9]{3})|DEBUG: Error|error code|Action start|Action ended' | Select-Object -Last 80 | ForEach-Object { $_.Line }
            throw "Installation fehlgeschlagen: $($p.ExitCode)"
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Athan\Athan.exe")) { throw "Athan.exe fehlt nach der Installation" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen: $($p.ExitCode)" }
          Write-Host "MSI installiert und deinstalliert ✓"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athan-windows-${{ env.VERSION }}
          path: |
            dist/*
            install.log

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Athan ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** `Athan-Setup-${{ env.VERSION }}.msi` herunterladen und doppelklicken (bei der SmartScreen-Warnung: Weitere Informationen → Trotzdem ausführen).
            Ohne Installation: `Athan.exe`.
          files: |
            dist/Athan.exe
            dist/Athan-Setup-*.msi
            dist/SHA256SUMS.txt

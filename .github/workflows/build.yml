name: Athan bauen

on:
  push:
    branches: [main]
    paths: ['web/**', 'windows/**', 'tools/**', 'installer/**', 'build.sh', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version bestimmen
        shell: bash
        run: |
          V=$(grep -oE "VERSION = '[0-9.]+'" web/js/app.js | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "VERSION=${V:-1.0.0}" >> "$GITHUB_ENV"

      - name: EXE + MSI (mkmsi)
        shell: bash
        run: ./build.sh

      - name: CAB-Varianten mit Windows prüfen (expand.exe)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/Athan.exe
          $want = (Get-FileHash $exe).Hash
          Push-Location tools
          foreach ($m in 'fixed','flate','stored','none') { foreach ($c in 'true','false') {
            $cab = "$env:RUNNER_TEMP\t-$m-$c.cab"
            go run ./mkmsi -exe $exe -cabmode $m "-csum=$c" -cabout $cab | Out-Null
            $dir = "$env:RUNNER_TEMP\x-$m-$c"; New-Item -ItemType Directory -Force $dir | Out-Null
            $o = & expand.exe $cab "-F:*" $dir 2>&1
            $f = Join-Path $dir 'AthanExe'
            $ok = (Test-Path $f) -and ((Get-FileHash $f).Hash -eq $want)
            $msg = if ($ok) { 'OK' } else { 'FEHLER ' + (($o | Out-String) -replace '\s+', ' ') }
            Write-Host ("CAB-TEST {0,-7} csum={1,-5} {2}" -f $m, $c, $msg)
          }}
          Pop-Location

      - name: MSI zusätzlich mit WiX
        continue-on-error: true
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer/athan.wxs -arch x64 -d Version=$VERSION -o "dist/Athan-Setup-$VERSION-wix.msi"

      - name: MSI testweise installieren und wieder entfernen
        shell: pwsh
        run: |
          $msi = Resolve-Path "dist/Athan-Setup-$env:VERSION.msi"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content install.log -Encoding Unicode | Select-String -Pattern 'Return value 3|Note: 1: (1[0-9]{3}|2[0-9]{3})|DEBUG: Error|error code|Action start|Action ended' | Select-Object -Last 80 | ForEach-Object { $_.Line }
            throw "Installation fehlgeschlagen: $($p.ExitCode)"
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Athan\Athan.exe")) { throw "Athan.exe fehlt nach der Installation" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen: $($p.ExitCode)" }
          Write-Host "MSI installiert und deinstalliert ✓"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athan-windows-${{ env.VERSION }}
          path: |
            dist/*
            install.log

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Athan ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** `Athan-Setup-${{ env.VERSION }}.msi` herunterladen und doppelklicken (bei der SmartScreen-Warnung: Weitere Informationen → Trotzdem ausführen).
            Ohne Installation: `Athan.exe`.
          files: |
            dist/Athan.exe
            dist/Athan-Setup-*.msi
            dist/SHA256SUMS.txt

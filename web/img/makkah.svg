<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Mekka bei Nacht: Masjid al-Haram mit Uhrturm, Minaretten und Kaaba – eigene Zeichnung für den Athan-Bildschirm -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020611"/><stop offset=".55" stop-color="#081738"/><stop offset=".8" stop-color="#1B2B55"/><stop offset="1" stop-color="#3A3550"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#F3D9A0" stop-opacity=".55"/><stop offset=".45" stop-color="#D8B26E" stop-opacity=".18"/><stop offset="1" stop-color="#D8B26E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clock" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF4D6"/><stop offset=".6" stop-color="#F3D9A0"/><stop offset="1" stop-color="#D8B26E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1430"/><stop offset="1" stop-color="#050A1A"/>
    </linearGradient>
    <linearGradient id="mataf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E6C8" stop-opacity=".32"/><stop offset="1" stop-color="#F3E6C8" stop-opacity=".08"/>
    </linearGradient>
    <g id="minaret">
      <rect x="-7" y="0" width="14" height="330" fill="url(#bld)"/>
      <rect x="-11" y="70" width="22" height="7" fill="#0E1A3A"/><rect x="-11" y="150" width="22" height="7" fill="#0E1A3A"/><rect x="-10" y="230" width="20" height="6" fill="#0E1A3A"/>
      <rect x="-5" y="72" width="10" height="3" fill="#F3D9A0" opacity=".7"/><rect x="-5" y="152" width="10" height="3" fill="#F3D9A0" opacity=".7"/>
      <path d="M-7 0 L0 -46 L7 0Z" fill="#0B1430"/>
      <path d="M0 -62 a7 7 0 1 0 6 10 a5.5 5.5 0 1 1 -6 -10z" fill="#D8B26E"/>
    </g>
  </defs>
  <rect width="1200" height="1000" fill="url(#sky)"/>
  <!-- Sterne -->
  <g fill="#FFF" opacity=".8">
    <circle cx="90" cy="80" r="1.6"/><circle cx="210" cy="160" r="1.1"/><circle cx="330" cy="60" r="1.4"/><circle cx="460" cy="130" r="1"/>
    <circle cx="560" cy="40" r="1.3"/><circle cx="700" cy="110" r="1.1"/><circle cx="820" cy="70" r="1.6"/><circle cx="1010" cy="150" r="1.2"/>
    <circle cx="1120" cy="60" r="1.4"/><circle cx="150" cy="260" r="1"/><circle cx="390" cy="240" r="1.2"/><circle cx="950" cy="250" r="1"/>
    <circle cx="1080" cy="300" r="1.3"/><circle cx="60" cy="380" r="1.1"/><circle cx="640" cy="210" r="1"/><circle cx="250" cy="340" r="1.2"/>
  </g>
  <!-- Mondsichel -->
  <path d="M940 150 a46 46 0 1 0 40 66 a38 38 0 1 1 -40 -66z" fill="#F3DBA4" opacity=".9"/>
  <!-- Schein über der Moschee -->
  <rect y="400" width="1200" height="600" fill="url(#glow)"/>
  <!-- Uhrturm (Abraj al-Bait) mit Nebentürmen -->
  <g fill="url(#bld)">
    <rect x="455" y="560" width="70" height="440"/><rect x="675" y="575" width="70" height="425"/>
    <rect x="510" y="430" width="180" height="570"/>
    <rect x="535" y="330" width="130" height="110"/>
    <rect x="560" y="250" width="80" height="90"/>
    <path d="M572 250 L600 190 L628 250Z"/>
    <rect x="595" y="110" width="10" height="90"/>
  </g>
  <circle cx="600" cy="385" r="46" fill="url(#clock)"/>
  <circle cx="600" cy="385" r="30" fill="#FFF7E3"/>
  <path d="M600 385 V362 M600 385 L614 394" stroke="#3A2A10" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 72 a17 17 0 1 0 15 24 a13.5 13.5 0 1 1 -15 -24z" fill="#F3D9A0"/>
  <g fill="#F3D9A0" opacity=".55">
    <rect x="532" y="470" width="8" height="5"/><rect x="560" y="500" width="8" height="5"/><rect x="630" y="480" width="8" height="5"/><rect x="660" y="520" width="8" height="5"/>
    <rect x="545" y="560" width="8" height="5"/><rect x="610" y="590" width="8" height="5"/><rect x="470" y="620" width="6" height="4"/><rect x="700" y="640" width="6" height="4"/>
  </g>
  <!-- Minarette der Moschee -->
  <use href="#minaret" x="250" y="600"/><use href="#minaret" x="330" y="630"/>
  <use href="#minaret" x="870" y="630"/><use href="#minaret" x="950" y="600"/>
  <use href="#minaret" x="120" y="680"/><use href="#minaret" x="1080" y="680"/>
  <!-- Säulengänge mit Bögen -->
  <rect y="820" width="1200" height="180" fill="#070E24"/>
  <g fill="#F3D9A0" opacity=".42">
    <path d="M20 900 v-36 a16 16 0 0 1 32 0 v36z M80 900 v-36 a16 16 0 0 1 32 0 v36z M140 900 v-36 a16 16 0 0 1 32 0 v36z M200 900 v-36 a16 16 0 0 1 32 0 v36z M260 900 v-36 a16 16 0 0 1 32 0 v36z M320 900 v-36 a16 16 0 0 1 32 0 v36z"/>
    <path d="M848 900 v-36 a16 16 0 0 1 32 0 v36z M908 900 v-36 a16 16 0 0 1 32 0 v36z M968 900 v-36 a16 16 0 0 1 32 0 v36z M1028 900 v-36 a16 16 0 0 1 32 0 v36z M1088 900 v-36 a16 16 0 0 1 32 0 v36z M1148 900 v-36 a16 16 0 0 1 32 0 v36z"/>
  </g>
  <!-- Mataf (heller Umkreis) und Kaaba -->
  <ellipse cx="600" cy="955" rx="330" ry="60" fill="url(#mataf)"/>
  <ellipse cx="600" cy="955" rx="230" ry="38" fill="#FFFFFF" opacity=".12"/>
  <g transform="translate(600 925)">
    <path d="M-62 -62 L0 -82 L62 -62 L62 18 L0 36 L-62 18Z" fill="#0A0A0E"/>
    <path d="M0 -82 L62 -62 L62 18 L0 36Z" fill="#141419"/>
    <path d="M-62 -42 L0 -60 L62 -42 L62 -32 L0 -50 L-62 -32Z" fill="#D8B26E"/>
    <path d="M20 -12 L40 -18 L40 16 L20 22Z" fill="#C9A35F" opacity=".8"/>
  </g>
</svg>
